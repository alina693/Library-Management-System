<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage & Add Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1e352b;
    --green-mid: #2c4a3c;
    --paper: #ede4cf;
    --paper-2: #e2d6ba;
    --ink: #2a2420;
    --ink-dim: #6b6154;
    --brass: #a97c3f;
    --brass-light: #c99a54;
    --stamp-red: #a13d33;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--green-deep);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ---------------- Header ---------------- */
  .page-header {
    background: linear-gradient(180deg, var(--green-mid), var(--green-deep));
    border-bottom: 3px solid var(--brass);
    padding: 36px 24px 30px;
    text-align: center;
  }

  .page-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 36px;
    color: var(--paper);
    margin: 0 0 6px;
  }

  .page-header p {
    font-family: 'Inter', sans-serif;
    color: rgba(237, 228, 207, 0.6);
    margin: 0;
    font-size: 14.5px;
  }

  /* ---------------- Content ---------------- */
  .content {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 24px 70px;
  }

  /* Top action row: search + add button */
  .action-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 240px;
  }

  .search-wrap .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-dim);
    font-size: 16px;
    pointer-events: none;
  }

  .search-wrap input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 13px 16px 13px 40px;
    background: var(--paper);
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: var(--radius);
    color: var(--ink);
  }

  .search-wrap input::placeholder { color: var(--ink-dim); }

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: var(--radius);
    padding: 13px 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }

  .btn-add {
    background: var(--brass);
    color: #241d0f;
  }
  .btn-add:hover { background: var(--brass-light); }

  /* ---------------- Book list ---------------- */
  .book-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .book-row {
    background: var(--paper);
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 3px 10px rgba(30,25,15,0.2);
  }

  .book-info {
    flex: 1;
    min-width: 0;
  }

  .book-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    margin: 0 0 3px;
  }

  .book-meta {
    font-size: 13px;
    color: var(--ink-dim);
  }

  .book-meta .genre-tag {
    background: rgba(44,74,60,0.1);
    color: var(--green-mid);
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    margin-left: 8px;
  }

  .book-status {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .book-status.available {
    background: rgba(44,74,60,0.12);
    color: var(--green-mid);
  }

  .book-status.checked-out {
    background: rgba(161,61,51,0.1);
    color: var(--stamp-red);
  }

  .btn-delete {
    background: transparent;
    border: 1px solid var(--stamp-red);
    color: var(--stamp-red);
    font-size: 13px;
    padding: 9px 16px;
  }
  .btn-delete:hover { background: rgba(161,61,51,0.08); }

  /* ---------------- Empty state ---------------- */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(237,228,207,0.55);
  }
  .empty-state .icon { font-size: 32px; display: block; margin-bottom: 10px; }
  .empty-state .title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    color: var(--paper);
    margin-bottom: 4px;
  }
  .empty-state .sub { font-size: 13.5px; }

  /* ---------------- Modal ---------------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-card {
    background: var(--paper);
    width: 100%;
    max-width: 420px;
    border-radius: var(--radius);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    padding: 26px 28px 28px;
    border-top: 4px solid var(--brass);
  }

  .modal-card h2 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0 0 18px;
    color: var(--green-deep);
  }

  .field-group { margin-bottom: 14px; }

  .field-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-dim);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field-group input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 10px 12px;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 6px;
    background: #fbf7ec;
    color: var(--ink);
  }

  .field-group input:focus {
    outline: 2px solid var(--brass);
    outline-offset: 1px;
  }

  .field-row {
    display: flex;
    gap: 12px;
  }
  .field-row .field-group { flex: 1; }

  .field-error {
    font-size: 12px;
    color: var(--stamp-red);
    margin-top: 4px;
    display: none;
  }

  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid rgba(0,0,0,0.25);
    color: var(--ink);
  }
  .btn-outline:hover { background: rgba(0,0,0,0.05); }

  /* ---------------- Toast ---------------- */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green-deep);
    color: var(--paper);
    border: 1px solid var(--brass);
    padding: 12px 22px;
    border-radius: var(--radius);
    font-size: 13.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 200;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .hidden { display: none !important; }

  @media (max-width: 560px) {
    .book-row { flex-wrap: wrap; }
    .page-header h1 { font-size: 28px; }
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--brass-light);
    outline-offset: 2px;
  }
</style>
</head>
<body>

  <header class="page-header">
    <h1>Manage &amp; Add Books</h1>
    <p>Search your collection, add new titles, or remove old ones</p>
  </header>

  <main class="content">

    <div class="action-row">
      <div class="search-wrap">
        <span class="icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="Search by title or author..." />
      </div>
      <button class="btn btn-add" id="openAddModal">+ Add Book</button>
    </div>

    <section class="book-list" id="bookList">
      <!-- injected -->
    </section>

  </main>

  <!-- Add Book Modal -->
  <div class="modal-overlay hidden" id="bookModal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
      <h2 id="modalHeading">Add a New Book</h2>

      <form id="bookForm" novalidate>
        <div class="field-group">
          <label for="titleInput">Title</label>
          <input type="text" id="titleInput" placeholder="e.g. The Silent Patient" />
          <div class="field-error" id="titleError">Title is required.</div>
        </div>

        <div class="field-group">
          <label for="authorInput">Author</label>
          <input type="text" id="authorInput" placeholder="e.g. Alex Michaelides" />
          <div class="field-error" id="authorError">Author is required.</div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="genreInput">Genre</label>
            <input type="text" id="genreInput" placeholder="e.g. Fiction" />
          </div>
          <div class="field-group">
            <label for="copiesInput">Copies</label>
            <input type="number" id="copiesInput" min="1" value="1" />
          </div>
        </div>

        <div class="modal-buttons">
          <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-add">Add Book</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // ---- Your live backend URL ----
  // While testing locally with `npm start` on your machine, use:
  //   const API_BASE = 'http://localhost:3000/api/books';
  // Once your backend is deployed on Render, switch to your Render URL, e.g.:
  //   const API_BASE = 'https://your-app.onrender.com/api/books';
  const API_BASE = 'http://localhost:3000/api/books';

  let books = [];

  // ---------- API calls ----------
  async function fetchBooks(searchTerm = '') {
    const url = searchTerm ? `${API_BASE}?search=${encodeURIComponent(searchTerm)}` : API_BASE;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Failed to fetch books from the server');
    const json = await res.json();
    return json.data;
  }

  async function createBookApi(payload) {
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!res.ok || !json.success) throw new Error(json.message || 'Failed to add book');
    return json.data;
  }

  async function deleteBookApi(id) {
    const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
    const json = await res.json();
    if (!res.ok || !json.success) throw new Error(json.message || 'Failed to delete book');
    return json;
  }

  // DOM refs
  const bookList = document.getElementById('bookList');
  const searchInput = document.getElementById('searchInput');
  const openAddModalBtn = document.getElementById('openAddModal');
  const cancelModalBtn = document.getElementById('cancelModalBtn');
  const bookModal = document.getElementById('bookModal');
  const bookForm = document.getElementById('bookForm');
  const titleInput = document.getElementById('titleInput');
  const authorInput = document.getElementById('authorInput');
  const genreInput = document.getElementById('genreInput');
  const copiesInput = document.getElementById('copiesInput');
  const titleError = document.getElementById('titleError');
  const authorError = document.getElementById('authorError');
  const toast = document.getElementById('toast');

  // Init — load books from the database on page load
  init();

  async function init() {
    try {
      books = await fetchBooks();
      renderList();
    } catch (err) {
      bookList.innerHTML = `
        <div class="empty-state">
          <span class="icon">&#9888;&#65039;</span>
          <div class="title">Couldn't load books</div>
          <div class="sub">Make sure your backend server is running at ${API_BASE}</div>
        </div>`;
    }
  }

  openAddModalBtn.addEventListener('click', openModal);
  cancelModalBtn.addEventListener('click', closeModal);
  bookModal.addEventListener('click', (e) => { if (e.target === bookModal) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !bookModal.classList.contains('hidden')) closeModal(); });
  bookForm.addEventListener('submit', handleFormSubmit);

  // Debounce search so we're not hitting the API on every keystroke
  let searchTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      try {
        books = await fetchBooks(searchInput.value.trim());
        renderList();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }, 300);
  });

  function renderList() {
    bookList.innerHTML = '';

    if (books.length === 0) {
      bookList.innerHTML = `
        <div class="empty-state">
          <span class="icon">&#128218;</span>
          <div class="title">No books found</div>
          <div class="sub">Try a different search, or add a new book.</div>
        </div>`;
      return;
    }

    books.forEach(book => bookList.appendChild(renderRow(book)));
  }

  function renderRow(book) {
    const row = document.createElement('div');
    row.className = 'book-row';

    const isOut = Number(book.available) === 0;

    row.innerHTML = `
      <div class="book-info">
        <p class="book-title">${escapeHtml(book.title)}</p>
        <div class="book-meta">
          by ${escapeHtml(book.author)}
          <span class="genre-tag">${escapeHtml(book.genre || 'General')}</span>
        </div>
      </div>
      <span class="book-status ${isOut ? 'checked-out' : 'available'}">${isOut ? 'Checked Out' : 'Available'}</span>
      <button class="btn btn-delete" data-id="${book.id}">Delete</button>
    `;

    row.querySelector('.btn-delete').addEventListener('click', () => handleDelete(book));

    return row;
  }

  async function handleDelete(book) {
    if (!confirm(`Delete "${book.title}" from the collection?`)) return;
    try {
      await deleteBookApi(book.id);
      books = books.filter(b => b.id !== book.id);
      renderList();
      showToast(`Deleted "${book.title}".`);
    } catch (err) {
      showToast(err.message || 'Failed to delete book', 'error');
    }
  }

  function openModal() {
    bookForm.reset();
    copiesInput.value = 1;
    titleError.style.display = 'none';
    authorError.style.display = 'none';
    bookModal.classList.remove('hidden');
    titleInput.focus();
  }

  function closeModal() {
    bookModal.classList.add('hidden');
  }

  async function handleFormSubmit(e) {
    e.preventDefault();

    const title = titleInput.value.trim();
    const author = authorInput.value.trim();
    let valid = true;

    titleError.style.display = 'none';
    authorError.style.display = 'none';

    if (!title) { titleError.style.display = 'block'; valid = false; }
    if (!author) { authorError.style.display = 'block'; valid = false; }
    if (!valid) return;

    const genre = genreInput.value.trim() || 'General';
    const copies = Math.max(1, Number(copiesInput.value) || 1);

    try {
      const newBook = await createBookApi({ title, author, genre, copies });
      books.unshift(newBook);
      renderList();
      closeModal();
      showToast(`Added "${title}" to the collection.`);
    } catch (err) {
      showToast(err.message || 'Failed to add book', 'error');
    }
  }

  let toastTimer;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
